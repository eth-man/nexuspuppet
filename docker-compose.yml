# NexusPuppet — single-VM on-prem deployment (C4 L2).
#
# The enc-data volume is the handoff surface to Puppet (ADR-0003):
# read-write here, READ-ONLY wherever puppetserver mounts it. Only the api
# service may write it.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexuspuppet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-nexuspuppet}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nexuspuppet}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # EVERY key in .env reaches the container.
    #
    # This block used to enumerate the settings the service received, and that
    # silently discarded around twenty documented ones — including
    # BOOTSTRAP_ADMIN_EMAIL and BOOTSTRAP_ADMIN_PASSWORD, so a fresh deployment
    # had no account and nobody could log in, and PUPPETDB_PROJECTED_FACTS,
    # which .env.example spends three paragraphs telling operators to customise
    # and whose default silently matches nothing for a rule written against a
    # fact it omits.
    #
    # A missing .env now fails loudly here, which is the right outcome: it names
    # the file to create instead of starting a deployment that cannot be logged
    # into.
    env_file: .env
    environment:
      # Only what must differ INSIDE the container. These override .env by
      # design — .env.example says so at each one.
      NODE_ENV: production
      API_PORT: 3001
      # `db`, the Compose service name, not the host address in .env.
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexuspuppet}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nexuspuppet}?schema=public
      # Kept enumerated for the `:?` guard: a missing value fails at
      # `docker compose up` naming the variable, rather than at API start.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — openssl rand -base64 48}
      PUPPETDB_URL: ${PUPPETDB_URL:?PUPPETDB_URL is required}
      # Mount points, not host paths.
      PUPPETDB_CERT_PATH: /etc/nexuspuppet/certs/client.pem
      PUPPETDB_KEY_PATH: /etc/nexuspuppet/certs/client.key
      PUPPETDB_CA_PATH: /etc/nexuspuppet/certs/ca.pem
      ENC_OUTPUT_DIR: /srv/nexuspuppet/enc
      # Reporting only, and optional. Unset means "TLS terminates somewhere I
      # cannot see", which is the normal state and not an error (ADR-0013).
      # Reported on the Settings screen. Defaults so a checkout without it
      # says so plainly rather than claiming a version it is not.
      NEXUSPUPPET_VERSION: ${NEXUSPUPPET_VERSION:-0.0.0-dev}
      CONSOLE_TLS_CERT_PATH: ${CONSOLE_TLS_CERT_PATH:-}
      CONSOLE_HOSTNAME: ${CONSOLE_HOSTNAME:-}
    volumes:
      # Certificates as mounted files, never baked into the image (ADR-0004).
      - ${PUPPETDB_CERT_DIR:-./certs}:/etc/nexuspuppet/certs:ro
      # The ONLY writer of the ENC volume.
      - enc-data:/srv/nexuspuppet/enc
      # The PUBLIC certificate, as a SINGLE FILE — never the directory holding
      # the key. The api reports the certificate's expiry in Settings and has no
      # reason to be able to read a private key, so it is not given the
      # opportunity (ADR-0013). Mount it yourself in an override; there is no
      # default, because Docker silently creates a DIRECTORY for a bind source
      # that does not exist, and a directory where a certificate is expected
      # produces a worse error than an unset variable.
      #
      #   volumes:
      #     - /etc/nexuspuppet/tls/console.pem:/etc/nexuspuppet/console.pem:ro
    ports:
      # Loopback by DEFAULT. There is no TLS in front of this service until the
      # reverse proxy in DEPLOYMENT.md is in place, so binding every interface
      # out of the box puts login credentials on the network in cleartext.
      # Exposing it is now a deliberate act: API_BIND=0.0.0.0.
      - '${API_BIND:-127.0.0.1}:${API_PORT:-3001}:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3001/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        # Not a bare `- api`, which only waits for the container to exist. The
        # web tier relays every request server-side, so starting before the API
        # is answering means the first person to load the console gets an error
        # page from a deployment that is actually fine.
        condition: service_healthy
    # NO env_file here, deliberately. The api service takes the whole of .env;
    # this one must not. .env holds DATABASE_URL, JWT_SECRET and the PuppetDB
    # certificate paths, and the web tier is meant to be incapable of reaching
    # the database or PuppetDB at all — handing it those credentials would make
    # the boundary a convention rather than a fact. Enumerate what it needs.
    environment:
      NODE_ENV: production
      # Next.js standalone binds to $HOSTNAME, which Docker sets to the container
      # ID. It therefore listens on the container's own address and NOT on
      # 127.0.0.1 — so anything checking localhost inside the container gets
      # connection refused while the service is working perfectly.
      #
      # That is exactly what happened: the healthcheck added alongside this
      # service checked localhost and reported the container unhealthy forever.
      # Nothing noticed, because `depends_on` only became strict when the TLS
      # proxy started depending on web being healthy.
      HOSTNAME: 0.0.0.0
      # Server-side only. Deliberately not NEXT_PUBLIC_ — the browser never
      # receives an API address, database credential, or certificate.
      API_INTERNAL_URL: http://api:3001
    ports:
      # Loopback by default, as above. WEB_BIND=0.0.0.0 to publish it.
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000'
    healthcheck:
      # `docker compose ps` reported the web tier as Up while it was still
      # booting, so a deployment looked complete before it could serve a page.
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # TLS termination (ADR-0013). OPT-IN:
  #
  #   docker compose --profile tls up -d
  #
  # Off by default, so an operator who already runs a reverse proxy is
  # unaffected and nothing about the web tier changes. §7 of DEPLOYMENT.md
  # covers both paths.
  # The ONLY service that writes private key material (ADR-0017).
  #
  # It exists so certificate installation from the console does not require the
  # api to hold a key. The api mints a signed grant and never sees the upload;
  # the browser posts straight here through the proxy.
  cert-helper:
    profiles: ['tls']
    build:
      context: .
      dockerfile: apps/cert-helper/Dockerfile
    restart: unless-stopped
    environment:
      # Shared with the api, which signs installation grants with it. Verified
      # here with no call back to the api — this component does its work while
      # TLS is being replaced, which is exactly when the api may be unreachable.
      CERT_HELPER_SECRET: ${CERT_HELPER_SECRET:-}
      CONSOLE_HOSTNAME: ${CONSOLE_HOSTNAME:-}
      TLS_CONFIRM_TIMEOUT_SEC: ${TLS_CONFIRM_TIMEOUT_SEC:-120}
      CONSOLE_TLS_ROOT: /etc/nexuspuppet/tls
      CADDY_ADMIN_ORIGIN: http://proxy:2019
      CADDYFILE_PATH: /etc/caddy/Caddyfile
      CONSOLE_PROBE_HOST: proxy
      CONSOLE_PROBE_PORT: '443'
    volumes:
      # READ-WRITE, and the only mount in the stack that is. The proxy reads the
      # same path read-only; the api and web services do not mount it at all.
      - ${CONSOLE_TLS_DIR:-/etc/nexuspuppet/tls}:/etc/nexuspuppet/tls
      # The same Caddyfile the proxy runs. Reloading means POSTing this config
      # back with Cache-Control: must-revalidate — without which Caddy accepts
      # it, answers 200, and changes nothing, because it is byte-identical.
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    # NO PORTS. Reachable only over the Compose network, through the proxy route
    # that fronts it. Publishing this would expose certificate installation to
    # anything that can route to the host.

  proxy:
    profiles: ['tls']
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      # Must match the certificate AND what people type in the browser.
      #
      # NOT a `${VAR:?}` guard, deliberately. Compose interpolates every variable
      # in the file BEFORE it filters by profile, so a required-variable guard
      # here fails `docker compose up` for everyone — including deployments that
      # never enable this profile. Caddy refuses to start on an empty site
      # address, which fails only the people who opted in, which is correct.
      CONSOLE_HOSTNAME: ${CONSOLE_HOSTNAME:-}
      CADDY_LOG_LEVEL: ${CADDY_LOG_LEVEL:-INFO}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates as MOUNTED FILES, never uploaded through the app and never
      # stored in the database (ADR-0013). The private key is readable by this
      # container and by nothing else in the stack — the api and web services do
      # not mount this path.
      # Defaults to the documented production path rather than somewhere in the
      # checkout: if the profile is enabled without setting this, failing at the
      # place the guide tells operators to look is more useful than failing in a
      # gitignored directory they have never heard of.
      - ${CONSOLE_TLS_DIR:-/etc/nexuspuppet/tls}:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      # These DO bind every interface, unlike 3000 and 3001. That is the point:
      # this is the one service in the stack that terminates TLS, so it is the
      # one that is safe to expose. Leave web/api on loopback.
      - '${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443'
      - '${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80'
      # The admin API is deliberately NOT published. It can replace the running
      # configuration; the api service reaches it over the Compose network.
    healthcheck:
      test: ['CMD', 'caddy', 'version']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Reference only — your puppetserver almost certainly lives outside this
  # compose file. What matters is the READ-ONLY mount and the ENC script.
  #
  # puppetserver:
  #   image: puppet/puppetserver:latest
  #   volumes:
  #     - enc-data:/etc/puppetlabs/nexuspuppet:ro
  #     - ./scripts/nexuspuppet-enc.sh:/usr/local/bin/nexuspuppet-enc.sh:ro
  #   environment:
  #     # puppet.conf: node_terminus = exec
  #     #              external_nodes = /usr/local/bin/nexuspuppet-enc.sh
  #     NEXUSPUPPET_ENC_DIR: /etc/puppetlabs/nexuspuppet

volumes:
  caddy-data:
  caddy-config:
  db-data:
  enc-data:
