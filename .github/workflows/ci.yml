name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # No secrets here. The public pipeline must never need them (ADR-0002).
  NODE_VERSION: '22.x'

jobs:
  # ---------------------------------------------------------------------------
  # THE LOAD-BEARING JOB (ADR-0002).
  #
  # Proves the public repository builds, typechecks, lints, and tests with NO
  # enterprise layer present. This is what makes the open core genuinely open
  # rather than a marketing claim. It must never be made conditional, and it
  # must never be given access to the private repository.
  # ---------------------------------------------------------------------------
  core-isolation:
    name: Core builds without the enterprise layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Assert the enterprise layer is absent
        run: |
          if [ -e packages/enterprise ]; then
            echo "::error::packages/enterprise must never exist in the public repository (ADR-0002)."
            exit 1
          fi
          if [ -e .gitmodules ]; then
            echo "::error::.gitmodules would publish the private repository URL (ADR-0002)."
            exit 1
          fi
          if git grep -nIE 'from .@nexuspuppet/enterprise' -- 'apps' 'packages' \
               | grep -v 'enterprise.loader.ts'; then
            echo "::error::Static import of the enterprise package outside the loader (ADR-0002)."
            exit 1
          fi
          # `git add -f` overrides .gitignore by design, so the ignore rules
          # are a convenience and this is the actual guard. A leaked private
          # key has to be reissued, not deleted — it is public the moment it
          # is pushed.
          if git ls-files | grep -nE '(^|/)certs/.+\.(pem|key|crt|p12|pfx)$'; then
            echo "::error::Certificate material is committed under certs/. Reissue it — a pushed key is compromised."
            exit 1
          fi
          if git grep -nI -- '-----BEGIN\( RSA\| EC\| OPENSSH\| PGP\)\? PRIVATE KEY-----' -- . ':!*.md'; then
            echo "::error::A private key block is committed."
            exit 1
          fi

          echo "Core isolation checks passed."

      - run: npm ci

      # No-op without NEXUSPUPPET_ENTERPRISE_REPO. Running it here proves the
      # script is safe in the public pipeline.
      - run: npm run enterprise:fetch

      # Both shared packages, before anything typechecks against them: consumers
      # resolve them through dist/index.d.ts, absent in a fresh clone.
      - run: npm run build --workspace @nexuspuppet/contracts --workspace @nexuspuppet/tls-grant

      # Prisma 7 resolves DATABASE_URL via prisma.config.ts even for `generate`,
      # which never contacts a database. A dummy value is correct here.
      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/unused

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  prisma:
    name: Prisma schema and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexuspuppet
          POSTGRES_PASSWORD: nexuspuppet
          POSTGRES_DB: nexuspuppet_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nexuspuppet:nexuspuppet@localhost:5432/nexuspuppet_ci?schema=public
      # `migrate diff --from-migrations` replays migrations into a throwaway
      # database. Prisma does NOT create it — it connects and fails with P1003
      # if missing — so CI creates it explicitly below. Prisma may drop and
      # recreate its contents, so it must not be a database anything else uses.
      SHADOW_DATABASE_URL: postgresql://nexuspuppet:nexuspuppet@localhost:5432/nexuspuppet_shadow?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate

      # A committed schema with no matching migration means `migrate deploy`
      # would silently no-op during an operator's upgrade.
      # On a developer machine this database already exists, created as a side
      # effect of `prisma migrate dev` — which is precisely why its absence
      # only ever surfaces in CI.
      - name: Create the shadow database
        run: node scripts/ci/ensure-database.mjs nexuspuppet_shadow
        env:
          ADMIN_DATABASE_URL: postgresql://nexuspuppet:nexuspuppet@localhost:5432/postgres

      # Prisma 7 dropped --shadow-database-url and renamed --to-schema-datamodel
      # to --to-schema. The shadow database comes from prisma.config.ts, which
      # reads SHADOW_DATABASE_URL.
      - name: Migrations match the schema
        working-directory: apps/api
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema prisma/schema.prisma
          --exit-code

      - run: npm run db:deploy

      # Integration tests run against their OWN database and truncate tables,
      # so they must never share one with anything else.
      - run: npm run db:test:setup --workspace @nexuspuppet/api
        env:
          TEST_DATABASE_URL: postgresql://nexuspuppet:nexuspuppet@localhost:5432/nexuspuppet_test?schema=public

      # The transactional outbox and the advisory lock cannot be verified
      # against a mock — a mock confirms whatever the code already believes.
      - run: npm run test:int --workspace @nexuspuppet/api
        env:
          TEST_DATABASE_URL: postgresql://nexuspuppet:nexuspuppet@localhost:5432/nexuspuppet_test?schema=public

  # ---------------------------------------------------------------------------
  # END-TO-END.
  #
  # Boots the whole console — PuppetDB stand-in, API, web — against the
  # synthetic fixtures and drives it in a real browser. This is the only job
  # that exercises the browser/proxy/API/Postgres path as a whole, so it is the
  # only place a broken cookie scope or an unhydrated page can be caught.
  #
  # It runs BUILT artifacts, not `next dev`, so it tests what ships.
  # ---------------------------------------------------------------------------
  e2e:
    name: End-to-end (browser)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexuspuppet
          POSTGRES_PASSWORD: nexuspuppet
          POSTGRES_DB: nexuspuppet_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nexuspuppet:nexuspuppet@localhost:5432/nexuspuppet_e2e?schema=public
      # Not a secret: this database is created and destroyed by this job, and
      # is never reachable from outside the runner (ADR-0002 — the public
      # pipeline must need no secrets).
      JWT_SECRET: e2e-only-jwt-secret-not-used-anywhere-else
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: e2e-only-admin-password
      E2E_ADMIN_EMAIL: admin@example.com
      E2E_ADMIN_PASSWORD: e2e-only-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Boot the stack and run the suite
        run: ./scripts/ci/e2e-stack.sh

      # The trace and screenshots are the whole point of a failed browser run;
      # without them a red E2E job is just a name and a timeout.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            e2e/.results/
            e2e/.logs/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Installs the product the way DEPLOYMENT.md says to, and fails if that does
  # not work.
  #
  # Every other job here runs the SOURCE TREE. None built the image or started
  # the stack from docker-compose.yml, so the installation path — the first
  # thing every new user touches — was the least tested part of the repository.
  # Four blocking defects reached main through that gap. This closes it.
  # ---------------------------------------------------------------------------
  install-smoke:
    name: Installs from the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No setup-node on purpose. DEPLOYMENT.md §0 asks operators for Docker and
      # the Compose plugin and nothing else, so this job gets nothing else — if
      # a documented step needs Node on the host, it must fail here rather than
      # on someone's server.
      - name: Build, migrate, start, and log in
        run: ./scripts/ci/install-smoke.sh

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail 200

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check

  licenses:
    name: Dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # A GPL/AGPL dependency would create obligations Apache-2.0 cannot
      # satisfy (ADR-0007).
      - name: Fail on copyleft dependencies
        run: |
          npx --yes license-checker-rseidelsohn \
            --production \
            --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;Unlicense;CC0-1.0;CC-BY-4.0;BlueOak-1.0.0;Python-2.0;MPL-2.0" \
            --excludePrivatePackages
