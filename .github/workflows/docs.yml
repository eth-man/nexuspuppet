name: Docs site

# The documentation site at https://eth-man.github.io/nexuspuppet/, built from
# docs/guide/ with MkDocs Material (mkdocs.yml).
#
# A separate workflow, not a job in ci.yml: it is not a required check, needs no
# Node and no database, and must never delay the checks that are. Pull requests
# that touch documentation get a strict build, which fails on a broken link, a
# missing anchor or a missing screenshot. Pushes to main build and publish.
#
# Publishing needs the repository's Pages source set to "GitHub Actions".

on:
  pull_request:
    paths:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
      - 'scripts/docs/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
      - 'scripts/docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
